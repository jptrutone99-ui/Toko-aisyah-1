name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Clean Android Project
        run: |
          # Simpan file penting
          mkdir -p temp_backup
          [ -f lib/main.dart ] && cp lib/main.dart temp_backup/main.dart
          [ -f pubspec.yaml ] && cp pubspec.yaml temp_backup/pubspec.yaml
          [ -f logo.png ] && cp logo.png temp_backup/logo.png
          [ -f android/app/google-services.json ] && cp android/app/google-services.json temp_backup/google-services.json

          # Re-create struktur android bersih
          rm -rf android
          flutter create . --org com.tokoaisyah --project-name toko_aisyah --platforms android

          # Kembalikan file penting
          [ -f temp_backup/main.dart ] && cp temp_backup/main.dart lib/main.dart
          [ -f temp_backup/pubspec.yaml ] && cp temp_backup/pubspec.yaml pubspec.yaml
          [ -f temp_backup/logo.png ] && cp temp_backup/logo.png logo.png
          
          mkdir -p android/app
          [ -f temp_backup/google-services.json ] && cp temp_backup/google-services.json android/app/google-services.json

          # Tambahkan plugin Google Services ke build.gradle app
          if [ -f android/app/build.gradle ]; then
            echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
          fi
          
          # Tambahkan classpath google-services ke root build.gradle
          if [ -f android/build.gradle ]; then
            sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.1"' android/build.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Icon (Optional)
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            flutter pub run flutter_launcher_icons || true
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toko-Aisyah-Release
          path: build/app/outputs/flutter-apk/app-release.apk
