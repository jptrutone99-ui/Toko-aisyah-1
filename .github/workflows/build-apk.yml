name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project Structure
        run: |
          mkdir -p temp_backup
          [ -f lib/main.dart ] && cp lib/main.dart temp_backup/main.dart
          [ -f pubspec.yaml ] && cp pubspec.yaml temp_backup/pubspec.yaml
          [ -f android/app/google-services.json ] && cp android/app/google-services.json temp_backup/google-services.json
          
          rm -rf lib android ios web pubspec.yaml
          flutter create . --org com.tokoaisyah --project-name toko_aisyah
          
          [ -f temp_backup/main.dart ] && cp temp_backup/main.dart lib/main.dart
          [ -f temp_backup/pubspec.yaml ] && cp temp_backup/pubspec.yaml pubspec.yaml
          
          mkdir -p android/app
          [ -f temp_backup/google-services.json ] && cp temp_backup/google-services.json android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toko-Aisyah-Release
          path: build/app/outputs/flutter-apk/app-release.apk
